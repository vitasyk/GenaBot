services:
  bot:
    build: .
    container_name: gena_bot
    restart: always
    env_file:
      # production: .env (Supabase + Upstash); local test: BOT_ENV_FILE=.env.local
      - ${BOT_ENV_FILE:-.env}
    volumes:
      - ./credentials:/app/credentials
      - ./logs:/app/logs

  # Local testing only: `docker compose --profile local up`. Production uses Supabase and Upstash.
  db:
    profiles: ["local"]
    image: postgres:15-alpine
    container_name: gena_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genabot
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    profiles: ["local"]
    image: redis:7-alpine
    container_name: gena_redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
